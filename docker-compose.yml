services:
  bot:
    build: .
    # C3-01：这里过去是 "${APP_UID:-1000}:${APP_GID:-1000}"，**覆盖掉**了
    # Dockerfile 的 `USER app:app`，使「镜像非 root」这条不变量在默认部署路径上不成立；
    # 而 README 建议的 APP_UID="$(id -u)" 在 root 宿主上就是 0，容器于是以 root
    # 运行，且没有任何断言或告警。
    # 改成「必须显式给出」：未设置/为空时 compose 直接报错，而不是静默回落 0/1000。
    # 想与镜像内账号一致就显式写 APP_UID=10001 APP_GID=10001。
    user: "${APP_UID:?set APP_UID to the owner id of ./data, e.g. APP_UID=\"$(id -u)\"}:${APP_GID:?set APP_GID to the group id of ./data, e.g. APP_GID=\"$(id -g)\"}"
    init: true
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./bot:/app/bot:ro
      # Prompt templates are loaded from this directory at runtime and seeded
      # into runtime_config on first boot.  Without the mount the container
      # keeps the copy baked into the image, so prompt edits silently had no
      # effect and the owner-policy migration kept re-applying the old text.
      - ./prompt:/app/prompt:ro
      # Legacy one-time import only; ignored after runtime_config is created.
      - ./config.toml:/app/config.toml:ro
    ports:
      # Safe default for a reverse proxy on this host. Set
      # MINIAPP_BIND_ADDRESS=0.0.0.0 only when another container/host must reach
      # the backend directly and a firewall protects the port.
      - "${MINIAPP_BIND_ADDRESS:-127.0.0.1}:${MINIAPP_LISTEN_PORT:-8480}:${MINIAPP_LISTEN_PORT:-8480}"
    environment:
      # The application now defaults to binding loopback (safe for bare-metal
      # systemd installs). A published port is DNAT'ed to the container's own
      # interface, so the in-container listener must bind every interface for
      # that mapping to answer; the host side stays limited to
      # MINIAPP_BIND_ADDRESS (loopback unless overridden). An explicit
      # MINIAPP_LISTEN_HOST in .env or the shell still wins.
      MINIAPP_LISTEN_HOST: "${MINIAPP_LISTEN_HOST:-0.0.0.0}"
      # 容器时区固定为中国时间。代码里大量「本地时间」是用 datetime.now().astimezone()
      # 取的，容器若是 UTC，静默时段/主动话题排期/日志时间全部按 UTC 走（比真实时间早
      # 8 小时：半夜活跃、白天装死）。镜像已装 tzdata，这里给死默认值。
      TZ: "${TZ:-Asia/Shanghai}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          port = os.environ.get('MINIAPP_LISTEN_PORT', '8480');
          urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Keep one bot from exhausting a small shared host. All limits are
    # overrideable for larger deployments without editing this file.
    mem_limit: "${BOT_MEMORY_LIMIT:-1536m}"
    memswap_limit: "${BOT_MEMORY_SWAP_LIMIT:-1536m}"
    mem_reservation: "${BOT_MEMORY_RESERVATION:-256m}"
    cpus: "${BOT_CPU_LIMIT:-2.0}"
    pids_limit: ${BOT_PIDS_LIMIT:-128}
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    logging:
      driver: local
      options:
        max-size: "${BOT_LOG_MAX_SIZE:-10m}"
        max-file: "${BOT_LOG_MAX_FILES:-5}"
    # The application drains durable updates, replies and cleanup jobs in a
    # bounded sequence; Docker's 10-second default would SIGKILL it mid-drain.
    # Must remain above the application's 110-second hard shutdown watchdog.
    stop_grace_period: 125s
    restart: unless-stopped
